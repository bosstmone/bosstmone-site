<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0d" />

  <title>Bosstmone — Донат</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <style>

    #splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  opacity: 1;
  transition: opacity 0.5s ease;
}

#splash-inner {
  text-align: center;
}

.spinner {
  width: 64px;
  height: 64px;
  margin: 0 auto 12px;
  border: 6px solid #eeeeee;
  border-top-color: #d4af37;
  border-radius: 50%;
  animation: splash-spin 1s linear infinite;
}

.splash-title {
  color: #555555;
  font-family: "Inter", sans-serif;
  font-weight: 600;
}

@keyframes splash-spin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation-duration: 2s;
  }
}

    :root {
      --text: #e6e0d6;
      --muted: #c8c0b0;
      --accent: #d4af37;
      --accent-light: #ffd76a;
      --border: rgba(212, 175, 55, 0.35);
      --shadow: 0 18px 38px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 0%, rgba(212, 175, 55, 0.15), transparent 38%),
        radial-gradient(circle at 90% 12%, rgba(0, 0, 0, 0.2), transparent 40%),
        linear-gradient(180deg, #0a0a0d 0%, #0b0b10 100%);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: min(1000px, 100%);
      margin: 0 auto;
      padding: 36px 20px 28px;
    }

    /* Навигация */
    .main-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 48px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(13, 14, 18, 0.76);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 999px;
      color: #14110a;
      background: linear-gradient(135deg, #ffd76a, #e5b942);
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.28);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .nav-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(212, 175, 55, 0.42);
    }

    /* Заголовок */
    .hero {
      margin: 0 auto 38px;
      text-align: center;
      animation: rise-in 0.7s ease both;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--accent-light);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.3rem, 6vw, 3.5rem);
      font-weight: 900;
      line-height: 1.12;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
    }

    .hero-description {
      max-width: 600px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    /* Карточки поддержки */
    .donation-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      max-width: 760px;
      margin: 0 auto;
    }

    .donation-card {
      position: relative;
      display: flex;
      min-height: 320px;
      flex-direction: column;
      align-items: center;
      padding: 28px 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        rgba(20, 24, 32, 0.86),
        rgba(18, 22, 28, 0.74)
      );
      box-shadow: var(--shadow);
      text-align: center;
      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        background 0.3s ease;
      animation: rise-in 0.65s ease both;
    }

    .donation-card::after {
      position: absolute;
      top: -55px;
      right: -45px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.08);
      content: "";
      pointer-events: none;
    }

    .donation-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 215, 106, 0.7);
      background: linear-gradient(
        135deg,
        rgba(29, 33, 42, 0.95),
        rgba(20, 24, 32, 0.9)
      );
    }

    .donation-icon {
      position: relative;
      z-index: 1;
      display: grid;
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      place-items: center;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      color: var(--accent-light);
      background: rgba(212, 175, 55, 0.1);
      font-size: 1.8rem;
    }

    .donation-card h2 {
      position: relative;
      z-index: 1;
      margin: 0 0 13px;
      color: var(--accent-light);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.4rem;
    }

    .amount {
      position: relative;
      z-index: 1;
      margin: 0 0 24px;
      color: #fff3cc;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .amount span {
      color: var(--accent-light);
      font-size: 1.2rem;
    }

    .donation-button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: auto;
      padding: 12px 20px;
      border-radius: 999px;
      color: #17130a;
      background: linear-gradient(135deg, #ffd76a, #e0b23a);
      font-size: 0.94rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 6px 15px rgba(212, 175, 55, 0.28);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .donation-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 20px rgba(212, 175, 55, 0.42);
    }

    .nav-link:focus-visible,
    .donation-button:focus-visible {
      outline: 3px solid #fff1bd;
      outline-offset: 4px;
    }

    footer {
      margin-top: 42px;
      padding: 22px 10px 6px;
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      color: #d8c69a;
      font-size: 0.83rem;
      text-align: center;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 22px 15px;
      }

      .main-nav {
        width: 100%;
        margin-bottom: 36px;
        border-radius: 22px;
      }

      .nav-link {
        flex: 1 1 125px;
        padding: 10px 12px;
        font-size: 0.88rem;
      }

      .donation-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .donation-card {
        min-height: 290px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div id="splash" role="status" aria-label="Загрузка сайта">
  <div id="splash-inner">
    <div class="spinner" aria-hidden="true"></div>
    <div class="splash-title">Bosstmone</div>
  </div>
</div>

  <main class="container">
    <nav class="main-nav" aria-label="Основная навигация">
      <a class="nav-link" href="index.html">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
        Главная
      </a>
      <a class="nav-link" href="about.html">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
        Обо мне
      </a>
      <a class="nav-link" href="ads.html">
        <i class="fa-solid fa-bullseye" aria-hidden="true"></i>
        Мои каналы
      </a>
      <a class="nav-link" href="quotes.html">
        <i class="fa-solid fa-quote-right" aria-hidden="true"></i>
        Цитаты
      </a>
      <a class="nav-link" href="contact.html">
        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
        Связь
      </a>
    </nav>

    <header class="hero">
      <p class="eyebrow">Bosstmone · поддержка</p>
      <h1>Поддержать проект</h1>
      <p class="hero-description">
        Твоя поддержка помогает развивать проект и заботиться о Симбе.
        Выбери удобный вариант.
      </p>
    </header>

    <section class="donation-grid" aria-label="Варианты поддержки">
      <article class="donation-card">
        <div class="donation-icon">
          <i class="fa-solid fa-arrow-trend-up" aria-hidden="true"></i>
        </div>
        <h2>Bosstmone</h2>
        <p class="amount">0 <span>₽</span></p>
        <a class="donation-button" href="https://www.donationalerts.com/r/bosstmone">
          <i class="fa-solid fa-heart" aria-hidden="true"></i>
          Поднять цену
        </a>
      </article>

      <article class="donation-card">
        <div class="donation-icon">
          <i class="fa-solid fa-paw" aria-hidden="true"></i>
        </div>
        <h2>Покормить Симбу</h2>
        <p class="amount">100 <span>₽</span></p>
        <a class="donation-button" href="https://www.donationalerts.com/r/bosstmone">
          <i class="fa-solid fa-bowl-food" aria-hidden="true"></i>
          Купить корм
        </a>
      </article>
    </section>

        <script>
      window.addEventListener("load", () => {
        const splash = document.getElementById("splash");

        if (!splash) return;

        splash.style.opacity = "0";

        setTimeout(() => {
          splash.remove();
        }, 500);
      });
    </script>

    <footer>
      © 2026 Bosstmone. Все права защищены.
    </footer>
  </main>
</body>
</html>
